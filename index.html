<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tasko - 모바일 투두</title>
    <meta name="description" content="심플하고 직관적인 모바일 할 일 관리(Todo) 애플리케이션" />
    <meta property="og:title" content="Tasko - 모바일 투두" />
    <meta property="og:description" content="심플하고 직관적인 모바일 할 일 관리(Todo) 애플리케이션" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 다크 모드: 화면이 그려지기 전에 먼저 정해서 새로고침 때 깜빡이지 않게 한다.
         저장된 값(tasko-theme)이 있으면 그것을, 없으면 기기 설정(시스템 다크 모드)을 따른다. -->
    <script>
      (function () {
        var mode = null;
        try {
          mode = localStorage.getItem('tasko-theme');
        } catch (error) {
          mode = null;
        }
        var useDark = false;
        if (mode === 'dark') {
          useDark = true;
        } else if (mode === 'light') {
          useDark = false;
        } else {
          useDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        if (useDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  </head>
  <body class="bg-[#1A1E29] min-h-screen text-[#212529] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
